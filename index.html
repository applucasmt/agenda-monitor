<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Agenda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-calendar-check"></i>
                <h1>Sistema de Agenda</h1>
                <p>Monitore suas agendas em tempo real</p>
            </div>
            <div class="login-form">
                <div class="form-group">
                    <label>
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Usuário">
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Senha">
                    </label>
                </div>
                <button onclick="login()" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                <p class="login-helper">Administrador: admin / admin123<br>Usuário: user / user123</p>
            </div>
        </div>
    </div>

    <!-- Tela do Administrador -->
    <div id="adminScreen" class="screen">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-calendar-check"></i>
                <span>Admin</span>
            </div>
            <div class="nav-actions">
                <button onclick="showTab('novaAgenda')" class="nav-btn active">
                    <i class="fas fa-plus"></i>
                </button>
                <button onclick="showTab('listaAgendas')" class="nav-btn">
                    <i class="fas fa-list"></i>
                </button>
                <button onclick="showTab('solicitacoes')" class="nav-btn">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="solicitacaoBadge">0</span>
                </button>
                <button onclick="logout()" class="nav-btn logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </nav>

        <div class="tab-content">
            <!-- Nova Agenda -->
            <div id="novaAgenda" class="tab-pane active">
                <div class="card">
                    <h2><i class="fas fa-plus-circle"></i> Nova Agenda</h2>
                    <form id="agendaForm" onsubmit="criarAgenda(event)">
                        <div class="form-group">
                            <label>Dia</label>
                            <input type="date" id="dia" required>
                        </div>
                        <div class="form-group">
                            <label>Horário</label>
                            <input type="time" id="horario" required>
                        </div>
                        <div class="form-group">
                            <label>Tipo da Agenda</label>
                            <select id="tipo" required>
                                <option value="Reunião">Reunião</option>
                                <option value="Palestra">Palestra</option>
                                <option value="Workshop">Workshop</option>
                                <option value="Treinamento">Treinamento</option>
                                <option value="Evento">Evento</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Participantes</label>
                            <input type="text" id="participantes" placeholder="João, Maria, Pedro" required>
                        </div>
                        <div class="form-group">
                            <label>Local</label>
                            <input type="text" id="local" placeholder="Nome do local" required>
                        </div>
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="status">
                                <option value="Pendente">Pendente</option>
                                <option value="Realizada">Realizada</option>
                                <option value="Cancelada">Cancelada</option>
                                <option value="Aguardando Autorização">Aguardando Autorização</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> Criar Agenda
                        </button>
                    </form>
                </div>
            </div>

            <!-- Lista de Agendas -->
            <div id="listaAgendas" class="tab-pane">
                <div class="card">
                    <h2><i class="fas fa-list"></i> Todas as Agendas</h2>
                    <div class="table-responsive">
                        <table id="agendaTable">
                            <thead>
                                <tr>
                                    <th>Dia</th>
                                    <th>Horário</th>
                                    <th>Tipo</th>
                                    <th>Participantes</th>
                                    <th>Local</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="agendaTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Solicitações -->
            <div id="solicitacoes" class="tab-pane">
                <div class="card">
                    <h2><i class="fas fa-bell"></i> Solicitações de Adiamento</h2>
                    <div id="solicitacoesList">
                        <p class="empty-message">Nenhuma solicitação pendente</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tela do Usuário -->
    <div id="userScreen" class="screen">
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-calendar-check"></i>
                <span>Minhas Agendas</span>
            </div>
            <div class="nav-actions">
                <button onclick="refreshAgendas()" class="nav-btn">
                    <i class="fas fa-sync"></i>
                </button>
                <button onclick="logout()" class="nav-btn logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </nav>

        <div class="user-content">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Buscar agenda..." oninput="filterAgendas()">
                <select id="statusFilter" onchange="filterAgendas()">
                    <option value="all">Todos os status</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Realizada">Realizada</option>
                    <option value="Cancelada">Cancelada</option>
                    <option value="Aguardando Autorização">Aguardando Autorização</option>
                </select>
            </div>
            <div id="cardsContainer" class="cards-grid">
                <!-- Cards serão gerados aqui -->
            </div>
        </div>
    </div>

    <!-- Modal para Adiar -->
    <div id="modalAdiar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2><i class="fas fa-clock"></i> Solicitar Adiamento</h2>
            <form id="adiarForm" onsubmit="solicitarAdiamento(event)">
                <input type="hidden" id="agendaIdAdiar">
                <div class="form-group">
                    <label>Nova Data</label>
                    <input type="date" id="novaData" required>
                </div>
                <div class="form-group">
                    <label>Novo Horário</label>
                    <input type="time" id="novoHorario" required>
                </div>
                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" id="solicitante" placeholder="Digite seu nome" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-paper-plane"></i> Solicitar
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
