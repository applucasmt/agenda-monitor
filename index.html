<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007AFF">
    <title>Agenda Monitor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- ==================== TELA DE LOGIN ==================== -->
        <div id="loginScreen" class="screen">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-icon">📅</div>
                    <h1 class="login-title">Agenda<span>Monitor</span></h1>
                    <p class="login-subtitle">Gerencie seus compromissos com inteligência</p>
                </div>

                <div class="login-form">
                    <div class="input-group">
                        <label class="input-label">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="email" id="loginEmail" placeholder="seu@email.com" class="input-field">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Senha</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="loginPassword" placeholder="••••••••" class="input-field">
                        </div>
                    </div>

                    <button id="loginBtn" class="btn-login">
                        <span>Entrar</span>
                        <span class="btn-arrow">→</span>
                    </button>

                    <div class="login-footer">
                        <span class="login-version">v2026.1</span>
                        <span class="login-divider">•</span>
                        <span class="login-secure">🔒 Conexão segura</span>
                    </div>
                </div>

                <!-- Credenciais de teste -->
                <div class="login-hint">
                    <p>👨‍💼 Admin: admin@agenda.com / admin123</p>
                    <p>👤 Usuário: user@agenda.com / user123</p>
                </div>
            </div>
        </div>

        <!-- ==================== TELA PRINCIPAL ==================== -->
        <div id="mainScreen" class="screen hidden">
            <!-- Header iOS -->
            <header class="ios-header">
                <div class="header-top">
                    <div class="header-left">
                        <span class="time-display" id="currentTime">12:00</span>
                    </div>
                    <div class="header-center">
                        <span class="header-title">📅 Agenda</span>
                    </div>
                    <div class="header-right">
                        <button id="logoutBtn" class="header-btn">Sair</button>
                    </div>
                </div>
                <div class="header-bottom">
                    <div class="user-greeting">
                        <span class="greeting-icon">👋</span>
                        <span class="greeting-text" id="greetingText">Olá, Usuário</span>
                        <span class="greeting-badge" id="roleBadge">Usuário</span>
                    </div>
                </div>
            </header>

            <!-- Stats iOS -->
            <section class="ios-stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="pendingCount">0</span>
                    <span class="stat-label">Pendentes</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedCount">0</span>
                    <span class="stat-label">Realizadas</span>
                </div>
            </section>

            <!-- ========== PAINEL ADMIN ========== -->
            <div id="adminPanel" class="panel hidden">
                <!-- Botão Nova Agenda -->
                <div class="panel-actions">
                    <button id="addAgendaBtn" class="btn-ios-primary">
                        <span>+</span> Nova Agenda
                    </button>
                </div>

                <!-- Formulário Nova Agenda -->
                <div id="agendaForm" class="form-ios hidden">
                    <div class="form-header">
                        <h3>📝 Nova Agenda</h3>
                        <button class="btn-close-form" id="closeFormBtn">✕</button>
                    </div>
                    <form id="agendaFormElement">
                        <div class="form-row">
                            <div class="form-group">
                                <label>📅 Data</label>
                                <input type="date" id="agendaData" required>
                            </div>
                            <div class="form-group">
                                <label>⏰ Horário</label>
                                <input type="time" id="agendaHorario" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>🏷️ Tipo</label>
                            <input type="text" id="agendaTipo" placeholder="Ex: Reunião de Projeto" required>
                        </div>
                        <div class="form-group">
                            <label>👥 Participantes</label>
                            <input type="text" id="agendaParticipantes" placeholder="email1@email.com, email2@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>📍 Local</label>
                            <input type="text" id="agendaLocal" placeholder="Av. Paulista, 1000" required>
                        </div>
                        <div class="form-group">
                            <label>📊 Status</label>
                            <select id="agendaStatus">
                                <option value="Pendente">Pendente</option>
                                <option value="Realizada">Realizada</option>
                                <option value="Cancelada">Cancelada</option>
                                <option value="Adiada">Adiada</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-ios-success">Salvar</button>
                            <button type="button" class="btn-ios-secondary" id="cancelFormBtn">Cancelar</button>
                        </div>
                    </form>
                </div>

                <!-- Lista Admin -->
                <div class="agenda-list" id="adminAgendaList"></div>
            </div>

            <!-- ========== PAINEL USUÁRIO ========== -->
            <div id="userPanel" class="panel">
                <div class="panel-filter">
                    <select id="statusFilter" class="filter-select-ios">
                        <option value="all">📊 Todos</option>
                        <option value="Pendente">⏳ Pendentes</option>
                        <option value="Realizada">✅ Realizadas</option>
                        <option value="Cancelada">❌ Canceladas</option>
                        <option value="Adiada">🔄 Adiadas</option>
                    </select>
                </div>
                <div class="agenda-list" id="userAgendaList"></div>
            </div>
        </div>

        <!-- ==================== MODAL ADIAMENTO ==================== -->
        <div id="rescheduleModal" class="modal-ios hidden">
            <div class="modal-content-ios">
                <div class="modal-header-ios">
                    <h3>⏰ Solicitar Adiamento</h3>
                    <button class="modal-close-ios">✕</button>
                </div>
                <form id="rescheduleForm">
                    <div class="form-group">
                        <label>📅 Nova Data</label>
                        <input type="date" id="novaData" required>
                    </div>
                    <div class="form-group">
                        <label>⏰ Novo Horário</label>
                        <input type="time" id="novoHorario" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-ios-success">Solicitar</button>
                        <button type="button" class="btn-ios-secondary modal-close-ios">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ==================== TOAST ==================== -->
        <div id="toast" class="toast-ios hidden">
            <span class="toast-icon">✅</span>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
