<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007AFF">
    <title>Agenda Monitor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>📅 Agenda Monitor</h1>
                <div class="user-controls">
                    <button id="adminToggle" class="btn-toggle">👤 Admin</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Admin Panel -->
            <section id="adminPanel" class="panel hidden">
                <div class="panel-header">
                    <h2>Painel Administrativo</h2>
                    <button id="addAgendaBtn" class="btn-primary">+ Nova Agenda</button>
                </div>
                
                <!-- Formulário de Agenda -->
                <div id="agendaForm" class="form-container hidden">
                    <h3>Nova Agenda</h3>
                    <form id="agendaFormElement">
                        <div class="form-group">
                            <label for="agendaData">Data</label>
                            <input type="date" id="agendaData" required>
                        </div>
                        <div class="form-group">
                            <label for="agendaHorario">Horário</label>
                            <input type="time" id="agendaHorario" required>
                        </div>
                        <div class="form-group">
                            <label for="agendaTipo">Tipo de Agenda</label>
                            <input type="text" id="agendaTipo" placeholder="Ex: Reunião, Palestra..." required>
                        </div>
                        <div class="form-group">
                            <label for="agendaParticipantes">Participantes</label>
                            <input type="text" id="agendaParticipantes" placeholder="Nome dos participantes (separados por vírgula)" required>
                        </div>
                        <div class="form-group">
                            <label for="agendaLocal">Local</label>
                            <input type="text" id="agendaLocal" placeholder="Endereço completo" required>
                        </div>
                        <div class="form-group">
                            <label for="agendaStatus">Status</label>
                            <select id="agendaStatus">
                                <option value="Pendente">Pendente</option>
                                <option value="Realizada">Realizada</option>
                                <option value="Cancelada">Cancelada</option>
                                <option value="Adiada">Adiada</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-success">Salvar</button>
                            <button type="button" id="cancelForm" class="btn-danger">Cancelar</button>
                        </div>
                    </form>
                </div>

                <!-- Lista de Agendas (Admin) -->
                <div id="adminAgendaList" class="agenda-list">
                    <!-- Cards serão gerados aqui -->
                </div>
            </section>

            <!-- User Panel -->
            <section id="userPanel" class="panel">
                <div class="panel-header">
                    <h2>Minhas Agendas</h2>
                    <div class="filter-controls">
                        <select id="statusFilter">
                            <option value="all">Todos</option>
                            <option value="Pendente">Pendentes</option>
                            <option value="Realizada">Realizadas</option>
                            <option value="Cancelada">Canceladas</option>
                            <option value="Adiada">Adiadas</option>
                        </select>
                    </div>
                </div>
                
                <!-- Lista de Agendas (User) -->
                <div id="userAgendaList" class="agenda-list">
                    <!-- Cards serão gerados aqui -->
                </div>
            </section>
        </main>

        <!-- Modal para Adiamento -->
        <div id="rescheduleModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Solicitar Adiamento</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <form id="rescheduleForm">
                    <div class="form-group">
                        <label for="novaData">Nova Data</label>
                        <input type="date" id="novaData" required>
                    </div>
                    <div class="form-group">
                        <label for="novoHorario">Novo Horário</label>
                        <input type="time" id="novoHorario" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-success">Solicitar Adiamento</button>
                        <button type="button" class="btn-danger modal-close">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
